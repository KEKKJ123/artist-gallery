name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        # Windows：红豆的主力机；Ubuntu：近似 Termux/Android 的 Linux 行为（大小写敏感、255 字节文件名上限）
        os: [windows-latest, ubuntu-latest]
        python: ["3.12", "3.14"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          allow-prereleases: true
      - run: python -m pip install -e ".[dev]"
      - run: ruff format --check .
      - run: ruff check .
      - run: python -m pytest -q -rs

  hygiene:
    # 文件卫生：统一文本文件不带 BOM，避免读入字符串后 ast.parse 等工具报错。
    # PowerShell 5.1 的 `Set-Content -Encoding utf8` 会悄悄加 BOM，所以由 CI 兜底。
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: 不允许提交带 BOM 的文本文件
        shell: bash
        run: |
          bad=$(git ls-files -z '*.py' '*.js' '*.vue' '*.css' '*.html' '*.md' '*.json' '*.yml' '*.toml' '*.sql' '*.svg' \
            | while IFS= read -r -d '' f; do
                # 不用末尾的 && 链：正常文件的条件为假时，循环仍应成功，不能触发 bash -e 退出。
                # -z / -d '' 按 NUL 分隔路径，中文不会被 git 转义，空格也不会被 read 裁掉。
                if [ -f "$f" ] && [ "$(head -c3 "$f" | xxd -p)" = "efbbbf" ]; then
                  printf '%s\n' "$f"
                fi
              done)
          if [ -n "$bad" ]; then
            echo "::error::以下文件以 UTF-8 BOM 开头，请去掉（用 VS Code：右下角编码 → 通过编码保存 → UTF-8）："
            printf '%s\n' "$bad"
            exit 1
          fi

  frontend:
    # 前端：跑单元测试，并检查"提交进仓库的构建产物"和源码是否一致。
    # 产物提交进仓库是为了让手机 Termux 不装 Node 也能用；代价是改了源码忘记重新构建就会过期，由这里兜底。
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build
      - name: 构建产物必须已提交且与源码一致
        working-directory: .
        run: |
          git add -N src/artist_gallery/server/static
          if ! git diff --exit-code --stat -- src/artist_gallery/server/static; then
            echo "::error::前端构建产物与源码不一致。请在 frontend/ 下运行 npm run build，并提交 src/artist_gallery/server/static/ 的改动。"
            exit 1
          fi
